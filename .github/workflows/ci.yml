name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.14 是开发机上实际用的版本，一并测，免得只在本机能跑
        python-version: ["3.11", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: 准备 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 跑测试
        run: python -m pytest tests/ -v

      - name: 分诊评测（阈值下调会立刻暴露）
        run: python -m scripts.evaluate

      - name: 自检
        run: python -m scripts.selfcheck

  # 保证 README 里的关键结论不是嘴上说的：
  # 如果哪天改动导致评测指标掉下来，这一步会失败并把报告贴出来。
  triage-quality-gate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 评测指标回归检查
        run: |
          python -m scripts.evaluate | tee eval_report.txt
          python - <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path("data/eval_result.json").read_text(encoding="utf-8"))
          s = data["summary"]
          # 这两个下限略低于当前实测值（94.8% / 100%），留出正常波动空间
          top1, top3 = s["top1_rate"], s["top3_rate"]
          print(f"Top-1={top1:.1%}  Top-3={top3:.1%}  自动接诊准确率={s['auto_accuracy']:.1%}")
          failed = []
          if top1 < 0.90:
              failed.append(f"Top-1 掉到 {top1:.1%}，低于 90% 下限")
          if top3 < 0.98:
              failed.append(f"Top-3 掉到 {top3:.1%}，低于 98% 下限")
          if s["auto_accuracy"] < 0.95:
              failed.append(f"自动接诊准确率掉到 {s['auto_accuracy']:.1%}，低于 95% 下限")
          if failed:
              print("评测回归：")
              for f in failed:
                  print("  -", f)
              sys.exit(1)
          print("评测指标在预期范围内")
          PY
