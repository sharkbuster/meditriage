services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meditriage
      POSTGRES_PASSWORD: meditriage
      POSTGRES_DB: meditriage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meditriage"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      # 容器内连 db 服务，不是 localhost
      APP_DATABASE_URL: postgresql+psycopg://meditriage:meditriage@db:5432/meditriage
      APP_TRIAGE_MODE: rule
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m scripts.seed &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
